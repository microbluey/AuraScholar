name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]]; then
            echo "Dependabot managed branch is exempt from the contributor naming rule."
            exit 0
          fi
          pattern='^(feat|fix)/[a-z0-9]+(-[a-z0-9]+)*$'
          description="${HEAD_REF#*/}"
          if [[ ! "$HEAD_REF" =~ $pattern || ! "$description" =~ [a-z] ]]; then
            echo "::error title=Invalid branch name::Expected feat/<kebab-case> or fix/<kebab-case>, got $HEAD_REF"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - name: Check architecture health against pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_REF}:scripts/architecture-health.mjs" 2>/dev/null; then
            git show "${BASE_REF}:scripts/architecture-health.mjs" > "${RUNNER_TEMP}/architecture-health.mjs"
            node "${RUNNER_TEMP}/architecture-health.mjs" check \
              --repo "${GITHUB_WORKSPACE}" \
              --base "${BASE_REF}"
          else
            node scripts/architecture-health.mjs check --base "${BASE_REF}"
          fi
      - name: Check architecture health on main
        if: github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          if [[ -n "${BASE_REF}" ]] \
            && [[ "${BASE_REF}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BASE_REF}:scripts/architecture-health.mjs" 2>/dev/null; then
            git show "${BASE_REF}:scripts/architecture-health.mjs" > "${RUNNER_TEMP}/architecture-health.mjs"
            node "${RUNNER_TEMP}/architecture-health.mjs" check \
              --repo "${GITHUB_WORKSPACE}" \
              --base "${BASE_REF}"
          elif [[ -n "${BASE_REF}" ]] \
            && [[ "${BASE_REF}" != "0000000000000000000000000000000000000000" ]]; then
            node scripts/architecture-health.mjs check --base "${BASE_REF}"
          else
            pnpm health:ci
          fi
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
